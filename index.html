<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/JS/script.js" defer></script>
    <title>Main Page</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-top">
                <img src="/Images/logo.png" alt="Logo" class="logo">
                <div class="search-box">
                    <input type="text" placeholder="Search...">
                    <i class="fa fa-search"></i>
                </div>
                <button class="btn" id="openLoginBtn">Login/Register</button>
            </div>
            <div class="break"></div>
            <ul class="nav-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/HTML/Products.html">Products</a></li>
                <li><a href="/HTML/AboutUs.html">About Us</a></li>
                <li><a href="/HTML/ContactUs.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <footer>
        <p>&copy; 2026 Quantum Gear. All rights reserved.</p>
    </footer>
    <section class="login-section" id="loginSection">
        <div class="container" id="authContainer">
            <button class="close-btn" id="closeLoginBtn" aria-label="Close and return to home">&times;</button>
            <div class="form-container sign-up">
                <form class="login-form">
                    <h1>Create Account</h1>
                    <input type="text" placeholder="Username">
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">
                    <button type="submit">Sign Up</button>
                </form>
            </div>
            <div class="form-container sign-in">
                <form class="login-form">
                    <h1>Sign In</h1>
                    <input type="text" placeholder="Username">
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">
                    <a href="#">Forgot Password?</a>
                    <button type="submit">Login</button>
                </form>
            </div>
            <div class="toggle-container">
                <div class="toggle">
                    <div class="toggle-panel toggle-left">
                        <h1>Already have an account?</h1>
                        <p>Login to pick up right where you left off.</p>
                        <button class="hidden-btn" id="loginBtn">Login</button>
                    </div>
                    <div class="toggle-panel toggle-right">
                        <h1>Create Account</h1>
                        <p>Sign up to create an account</p>
                        <button class="hidden-btn" id="registerBtn">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
