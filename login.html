<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/global.css">
    <link rel="stylesheet" href="/CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/JS/login.js" defer></script>
    <title>Login / Register</title>
</head>
<body>
    <section class="login-section active" id="loginSection">
        <div class="container" id="authContainer">
            <button class="close-btn" id="closeLoginBtn" aria-label="Close and return to home">&times;</button>
            <div class="form-container sign-up">
                <form class="login-form" action="PHP/users/register.php" method="post">
                    <h1>Create Account</h1>
                    <input type="text" name="username" placeholder="Username">
                    <input type="email" name="email" placeholder="Email">
                    <input type="password" name="password" placeholder="Password">
                    <p class="form-message" id="registerMessage" role="alert"></p>
                    <button type="submit">Sign Up</button>
                </form>
            </div>
            <div class="form-container sign-in">
                <form class="login-form" action="PHP/users/authmain.php" method="post">
                    <h1>Sign In</h1>
                    <input type="text" name="login" placeholder="Username or Email">
                    <input type="password" name="password" placeholder="Password">
                    <a href="#">Forgot Password?</a>
                    <p class="form-message" id="loginMessage" role="alert"></p>
                    <button type="submit">Login</button>
                </form>
            </div>
            <div class="toggle-container">
                <div class="toggle">
                    <div class="toggle-panel toggle-left">
                        <h1>Already have an account?</h1>
                        <p>Login to pick up right where you left off.</p>
                        <button class="hidden-btn" id="loginBtn">Login</button>
                    </div>
                    <div class="toggle-panel toggle-right">
                        <h1>Create Account</h1>
                        <p>Sign up to create an account</p>
                        <button class="hidden-btn" id="registerBtn">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
